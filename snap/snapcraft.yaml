name: gitleaks
base: core26
version: '8.30.1'
title: Gitleaks
icon: snap/gui/gitleaks.png
summary: Find secrets in Git repositories, files and standard input
description: |
  Gitleaks detects passwords, API keys, tokens and other secrets in the
  history of Git repositories, in directories and files, and in text read
  from standard input. It prints findings or writes them as JSON, CSV,
  JUnit, SARIF or a custom template, and its rules can be extended with a
  TOML file.

  **Examples**

     gitleaks git -v ~/projects/my-project
     gitleaks dir -v ~/projects/my-project
     cat notes.txt | gitleaks stdin
     gitleaks git --pre-commit --staged --redact -v

  **File access**

  Gitleaks can scan repositories and files in your home directory. To
  also scan USB drives and other removable media (/media, /mnt), run:

     sudo snap connect gitleaks:removable-media

  The snap includes Git and has no network access.
license: MIT
grade: stable
confinement: strict
website: https://gitleaks.io
source-code:
  - https://github.com/gitleaks/gitleaks
  - https://github.com/sidalit/gitleaks-snap
issues:
  - https://github.com/gitleaks/gitleaks/issues
  - https://github.com/sidalit/gitleaks-snap/issues
contact: https://github.com/sidalit/gitleaks-snap/issues

platforms:
  amd64:
  arm64:

apps:
  gitleaks:
    command: bin/gitleaks
    completer: share/bash-completion/completions/gitleaks
    environment:
      # The host's /etc/gitconfig cannot be read under confinement.
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_EXEC_PATH: $SNAP/usr/lib/git-core
      XDG_CONFIG_HOME: $SNAP_USER_DATA/.config
    plugs:
      - home
      - removable-media

parts:
  gitleaks:
    plugin: nil
    source: https://github.com/gitleaks/gitleaks.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    source-depth: 1
    build-snaps:
      - go/1.27/stable
    build-environment:
      - CGO_ENABLED: '0'
      - GOTOOLCHAIN: local
    override-build: |
      # Gitleaks cannot compare a git-<commit> version with its config's minVersion.
      case "$SNAPCRAFT_PROJECT_VERSION" in
        git-*) version_flag= ;;
        *) version_flag="-X=github.com/zricethezav/gitleaks/v8/version.Version=$SNAPCRAFT_PROJECT_VERSION" ;;
      esac
      # No gore2regex tag: upstream's release binaries start about 0.4 s slower with it.
      go build -p "$CRAFT_PARALLEL_BUILD_COUNT" -trimpath \
        -ldflags "-s -w $version_flag" -o "$CRAFT_PART_INSTALL/bin/gitleaks" .
      completion="$CRAFT_PART_INSTALL/share/bash-completion/completions/gitleaks"
      install -Dm644 "$CRAFT_PROJECT_DIR/snap/local/completion-compat.bash" "$completion"
      "$CRAFT_PART_INSTALL/bin/gitleaks" completion bash >> "$completion"
      install -Dm644 LICENSE -t "$CRAFT_PART_INSTALL/share/doc/gitleaks"

  git:
    plugin: nil
    stage-slices:
      - git_bins
    # core26 already provides the C library, PCRE2 and zlib that git links to.
    stage:
      - usr/bin/git
      - usr/lib/git-core/git
      - usr/share/doc/git/copyright
